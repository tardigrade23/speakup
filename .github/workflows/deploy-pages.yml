name: Publish site

# Copies the app to the gh-pages branch, which GitHub Pages serves at
# https://tardigrade23.github.io/speakup/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site files to gh-pages
        run: |
          mkdir /tmp/site
          cp index.html app.js style.css sw.js manifest.webmanifest /tmp/site/
          cp -r icons /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
